<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<title>VfL Stenum II · Abschlussspiel-Tabelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070d; --panel:#0d0d1a; --panel2:#12122a; --line:rgba(255,255,255,.08);
  --tx:#eceefb; --mut:#a9abc6; --dim:#7a7a96;
  --cy:#22e6ff; --mg:#ff2bd6; --w:#2ef2c0; --l:#ff6b9c; --lb:#ff4f8b;
  --fl:#ffab5c; --fl2:#ff7a2e; --bl:#4db8ff; --ice:#8fe8ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;gap:14px}
.crest{width:58px;height:58px;object-fit:contain;mix-blend-mode:screen;filter:invert(1) hue-rotate(180deg) saturate(1.8) brightness(1.15) drop-shadow(0 0 6px rgba(34,230,255,.6));flex:none}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--cy)}
h1{margin:2px 0 0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em;text-shadow:0 0 18px rgba(34,230,255,.45)}
.grow{flex:1;min-width:0}
.chipbtn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;background:var(--panel);border:1px solid rgba(255,255,255,.14);font-weight:600;font-size:14px}
.chipbtn.on{border-color:rgba(34,230,255,.6);color:var(--cy)}
select.chipbtn{appearance:none;padding-right:14px;color:var(--tx)} select.chipbtn option{background:#0d0d1a;color:#eceefb}
.neon{height:2px;margin:14px 0;border-radius:2px;background:linear-gradient(90deg,var(--cy),var(--mg));box-shadow:0 0 12px rgba(34,230,255,.5)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:720px){.cards{display:flex;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scroll-snap-type:x proximity}.cards .card{min-width:230px;flex:none;scroll-snap-align:start}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card .k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mut)}
.card .v{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.card.hot{border-color:rgba(255,122,46,.5);box-shadow:0 0 18px rgba(255,122,46,.15)}
.card.cold{border-color:rgba(143,232,255,.45);box-shadow:0 0 18px rgba(143,232,255,.12)}
.card.best{border-color:rgba(34,230,255,.5);box-shadow:0 0 18px rgba(34,230,255,.15)}
.card .s{font-size:13px;color:var(--mut);font-weight:500}
.scroll{overflow-x:auto;margin:18px -16px 0;padding:0 16px;-webkit-overflow-scrolling:touch}
.tbl{min-width:max-content}
.row{display:grid;grid-template-columns:var(--cols);column-gap:8px;align-items:center;height:50px;padding:0 10px 0 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row.head{height:auto;align-items:end;padding-bottom:6px;border:0;font-size:11px;font-weight:600;color:#9a9ab6;letter-spacing:.06em;text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.panel.dash{border:1px dashed rgba(255,255,255,.16)}
.sticky1,.sticky2{position:sticky;z-index:2;background:var(--panel);height:100%;display:flex;align-items:center}
.sticky1{left:0;padding-left:14px;border-left:4px solid transparent}
.sticky2{left:var(--rk)}
.head .sticky1,.head .sticky2{background:var(--bg);align-items:flex-end}
.rk{font-size:14px;font-weight:700;color:var(--mut)}
.nm{display:inline-flex;align-items:center;padding:4px 10px;border-radius:9px;font-size:15px;font-weight:700;background:transparent;border:0;color:var(--tx);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{text-align:center;font-size:14px;font-weight:700}
.q{display:flex;flex-direction:column;gap:4px;padding-right:6px}
.q b{font-size:14px}
.qb{height:3px;border-radius:3px;background:rgba(255,255,255,.12)}
.qb i{display:block;height:3px;border-radius:3px;background:var(--cy);box-shadow:0 0 8px rgba(34,230,255,.8)}
.cell{justify-self:center;width:40px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;border:1px solid transparent}
.cell.W{color:var(--w);background:rgba(46,242,192,.12);border-color:rgba(46,242,192,.55);box-shadow:0 0 10px rgba(46,242,192,.25)}
.cell.L{color:var(--l);background:rgba(255,79,139,.12);border-color:rgba(255,79,139,.55);box-shadow:0 0 10px rgba(255,79,139,.25)}
.cell.A{border:1.5px dashed rgba(255,255,255,.14);color:var(--dim);font-weight:600}
.dhead{text-align:center;line-height:1.4}
.dhead b{display:block;color:var(--tx);font-weight:600;letter-spacing:0}
button.dhead{background:transparent;border:0;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;padding:2px 0;border-radius:6px}
button.dhead.edit{border:1px dashed rgba(34,230,255,.5);color:var(--cy)}
.alt{text-align:center;font-size:12px;font-weight:600;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px 3px 7px;border-radius:999px;font-size:13px;font-weight:800}
.pill.hot1{border:1px solid rgba(255,167,77,.6);color:var(--fl)}
.pill.hot2{background:rgba(255,122,46,.18);border:1px solid var(--fl2);box-shadow:0 0 14px rgba(255,122,46,.55);color:#ffc08a}
.pill.hot3{background:rgba(77,184,255,.16);border:1px solid var(--bl);box-shadow:0 0 14px rgba(77,184,255,.6);color:#a8dcff}
.pill.ice{background:rgba(143,232,255,.1);border:1px solid rgba(143,232,255,.6);box-shadow:0 0 12px rgba(143,232,255,.3);color:var(--ice)}
.sec{margin:26px 0 8px;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:22px;font-size:12px;color:var(--mut);align-items:center}
.muted{color:var(--dim)}
.empty{padding:40px 16px;text-align:center;color:var(--mut);line-height:1.6}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(7,7,13,0));display:flex;gap:10px;justify-content:center;z-index:5}
.btn{height:52px;padding:0 20px;border-radius:12px;background:transparent;border:1px solid rgba(255,255,255,.22);font-weight:600;font-size:15px}
.btn.pri{background:var(--cy);border:0;color:#07070d;font-weight:800;font-size:16px;box-shadow:0 0 18px rgba(34,230,255,.5)}
.btn.danger{border-color:rgba(255,79,139,.6);color:var(--l)}
.btn:disabled{opacity:.5}
.bar .pri{flex:1;max-width:420px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;justify-content:center;align-items:flex-end}
@media(min-width:700px){.ov{align-items:center}}
.sheet{width:100%;max-width:480px;max-height:94vh;max-height:94dvh;background:var(--bg);border:1px solid rgba(255,255,255,.12);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:700px){.sheet{border-radius:22px}}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px;gap:10px}
.sh-h h2{margin:2px 0 0;font-size:22px;font-weight:800;letter-spacing:-.01em;text-shadow:0 0 16px rgba(34,230,255,.45)}
.x{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}
.sh-b{overflow-y:auto;padding:4px 16px 8px;flex:1;min-height:0}
.sh-f{display:flex;gap:10px;padding:12px 16px calc(18px + env(safe-area-inset-bottom))}
.sh-f .pri{flex:1}
.txt{font-size:13px;line-height:1.45;color:var(--mut)}
.field{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.field label{font-size:13px;font-weight:600;color:#cfd1e6}
.inp{height:54px;padding:0 16px;background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:14px;color:var(--tx);font-size:17px;font-weight:500;outline:0;width:100%}
.inp:focus{border-color:rgba(34,230,255,.6);box-shadow:0 0 14px rgba(34,230,255,.18)}
.err{color:var(--l);font-size:13px;min-height:18px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:10px}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:0 8px 0 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.li:last-child{border:0}
.li .n{font-size:16px;font-weight:700}
.li .r{font-size:12px;color:#9a9ab6}
.tap{width:84px;height:44px;border-radius:10px;font-weight:800;font-size:16px;background:transparent;border:1.5px dashed rgba(255,255,255,.22);color:var(--dim);display:flex;align-items:center;justify-content:center}
.tap.W{background:rgba(46,242,192,.14);border:1.5px solid var(--w);color:var(--w);box-shadow:0 0 12px rgba(46,242,192,.3)}
.tap.L{background:rgba(255,79,139,.14);border:1.5px solid var(--lb);color:var(--l);box-shadow:0 0 12px rgba(255,79,139,.3)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.18);color:#cfd1e6}
.chip.c{background:rgba(34,230,255,.12);border-color:rgba(34,230,255,.5);color:var(--cy)}
.chip.w{color:var(--w);border-color:rgba(46,242,192,.5)}
.chip.l{color:var(--l);border-color:rgba(255,79,139,.5)}
.chip.warn{color:var(--fl);border-color:rgba(255,171,92,.6)}
.sw{width:60px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;padding:0}
.sw span{position:relative;display:block;width:52px;height:30px;border-radius:999px;border:1.5px solid rgba(255,255,255,.28)}
.sw span i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:999px;background:#7a7a96}
.sw.on span{background:rgba(34,230,255,.2);border-color:var(--cy);box-shadow:0 0 12px rgba(34,230,255,.3)}
.sw.on span i{left:auto;right:3px;background:var(--cy)}
.ni{width:60px;height:44px;text-align:center;background:transparent;border:1.5px dashed rgba(255,255,255,.22);border-radius:10px;outline:0;color:var(--tx);font-weight:800;font-size:17px}
.ni.f{border-style:solid}
.ni.w{color:var(--w)} .ni.w.f{border-color:rgba(46,242,192,.5);background:rgba(46,242,192,.1)}
.ni.l{color:var(--l)} .ni.l.f{border-color:rgba(255,79,139,.5);background:rgba(255,79,139,.1)}
.ni.s{width:48px;color:var(--fl)} .ni.s.f{border-color:rgba(255,171,92,.6)}
.tg{width:44px;height:44px;border-radius:10px;font-weight:800;border:1.5px dashed rgba(255,255,255,.22);background:transparent;color:var(--dim)}
.tg.W{background:rgba(46,242,192,.14);border:1.5px solid var(--w);color:var(--w)}
.tg.L{background:rgba(255,79,139,.14);border:1.5px solid var(--lb);color:var(--l)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 60px 60px auto;column-gap:8px;align-items:center;min-height:58px;padding:0 10px 0 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.srow.noS{grid-template-columns:minmax(0,1fr) 60px 60px}
.srow:last-child{border:0}
.srow .sg{display:flex;gap:4px}
.shead{display:grid;grid-template-columns:minmax(0,1fr) 60px 60px auto;column-gap:8px;padding:12px 10px 6px 16px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#9a9ab6;text-align:center}
.shead.noS{grid-template-columns:minmax(0,1fr) 60px 60px}
.shead>:first-child{text-align:left}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sc{display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.sc .k{font-size:11px;font-weight:600;letter-spacing:.08em;color:#9a9ab6}
.sc .v{font-size:26px;font-weight:800}
.form{display:flex;gap:6px;margin-top:8px}
.form>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;color:var(--dim)}
.form .cell{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#16162e;border:1px solid rgba(34,230,255,.5);color:var(--tx);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;box-shadow:0 0 18px rgba(34,230,255,.25)}
.menu .li{cursor:pointer;width:100%;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.06);color:var(--tx);text-align:left;font-size:16px;font-weight:600;height:56px}
svg{display:block}
</style>

const DEFAULT_SEASON = "2026-27";
const USER_DOMAIN = "@stenum.de";
const NAMES = ['Maxi','Nico','Bjarne','Crispin','Ege','Borchers','Julian','Julius','Kristian','Franzi','Marc','Matze','Mick','Mike','Nelson','Niclas','Kollek','Ole','Oscar','Philipp','Tarek','Tim-Luca','Tom','Yann','Daniel','Bodo','Luci'];
const ROLES = {Daniel:'Trainer', Bodo:'3. Trainer', Luci:'Co-Trainer'};
const slug = s => s.toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-').replace(/^-|-$/g,'') || 'p';
const DEFAULT_PLAYERS = NAMES.map(n => ({id:slug(n), name:n, role:ROLES[n]||'', hidden:!!ROLES[n]}));

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const fmtD = iso => { const [y,m,d] = iso.split('-').map(Number); const dt = new Date(y,m-1,d); return {wd:WD[dt.getDay()], d:String(d).padStart(2,'0')+'.'+String(m).padStart(2,'0')+'.', long:WD[dt.getDay()]+', '+String(d).padStart(2,'0')+'.'+String(m).padStart(2,'0')+'.'+y}; };
const todayISO = () => { const t = new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); };

const FLAME = c => `<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 2c.3 2.6 1.6 4 3.2 5.6C17.4 9.3 19 11.2 19 14a7 7 0 0 1-14 0c0-2.2 1-4 2.4-5.3.1 1.5.7 2.6 1.8 3.2C9.1 9 10 5 12.5 2z" fill="${c}"/></svg>`;
const FLAKE = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8fe8ff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M3.5 7l17 10M20.5 7l-17 10"/></svg>`;
const XICO = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#eceefb" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

/* ---------- state ---------- */
const S = {seasonId: DEFAULT_SEASON, seasons: [], data: null, loaded: false, user: null, unsub: null};
try { const sid = localStorage.getItem('season'); if (sid) S.seasonId = sid; } catch(e){}

function subscribe(){
  if (S.unsub) S.unsub();
  S.loaded = false; S.data = null; render();
  S.unsub = onSnapshot(doc(db,'seasons',S.seasonId), snap => {
    S.data = snap.exists() ? snap.data() : null;
    if (S.data) { S.data.players = S.data.players || []; S.data.days = S.data.days || {}; S.data.alt = S.data.alt || {}; }
    S.loaded = true; render(); refreshOpenSheet();
  }, err => { S.loaded = true; S.error = err.message; render(); });
}
async function loadSeasons(){
  try { const q = await getDocs(collection(db,'seasons')); S.seasons = q.docs.map(d => d.id).sort().reverse(); } catch(e){ S.seasons = []; }
  if (!S.seasons.includes(S.seasonId)) S.seasons.unshift(S.seasonId);
  render();
}
const isTrainer = () => !!S.user;
const ref = () => doc(db,'seasons',S.seasonId);

/* ---------- compute ---------- */
function compute(d){
  const dates = Object.keys(d.days).sort();
  const res = {};
  for (const p of d.players){
    const a = d.alt[p.id] || {};
    const seq = [];
    if (a.sn > 0 && (a.st === 'W' || a.st === 'L')) for (let i=0;i<a.sn;i++) seq.push({m:a.st});
    let dw=0, dl=0; const cells = {};
    const pts = [];
    let cw = a.w||0, cl = a.l||0;
    if (cw+cl>0) pts.push(100*cw/(cw+cl));
    for (const dt of dates){
      const m = (d.days[dt]||{})[p.id];
      if (m==='W'||m==='L'){ seq.push({m}); cells[dt]=m; if(m==='W'){dw++;cw++;}else{dl++;cl++;} pts.push(100*cw/(cw+cl)); }
    }
    const w = (a.w||0)+dw, l = (a.l||0)+dl;
    let last=null, n=0;
    if (seq.length){ last = seq[seq.length-1].m; for (let i=seq.length-1;i>=0&&seq[i].m===last;i--) n++; }
    let bw=0, bl=0, run=0, prev=null;
    for (const s of seq){ if (s.m===prev) run++; else { run=1; prev=s.m; } if (s.m==='W') bw=Math.max(bw,run); else bl=Math.max(bl,run); }
    res[p.id] = {p, w, l, games:w+l, ratio: w+l ? w/(w+l) : -1, quote: w+l ? Math.round(100*w/(w+l)) : null, last, n, bw, bl, att: dw+dl, cells, pts, alt:a};
  }
  return {dates, res};
}
function ranked(C, d){
  return d.players.filter(p=>!p.hidden).map(p=>C.res[p.id]).sort((a,b)=> b.ratio-a.ratio || b.w-a.w || a.l-b.l || a.p.name.localeCompare(b.p.name,'de'));
}

/* ---------- views ---------- */
function pill(r){
  if (r.last==='W' && r.n>=3){ const t = r.n>=7?'hot3':r.n>=5?'hot2':'hot1'; const c = r.n>=7?'#4db8ff':r.n>=5?'#ff7a2e':'#ffab5c'; return `<span class="pill ${t}">${FLAME(c)}${r.n}</span>`; }
  if (r.last==='L' && r.n>=3) return `<span class="pill ice">${FLAKE}${r.n}</span>`;
  return `<span class="muted">–</span>`;
}
function nameFx(r){
  if (r.last==='W' && r.n>=7) return 'box-shadow:0 0 0 1px #4db8ff,0 0 14px rgba(77,184,255,.6);background:rgba(77,184,255,.1)';
  if (r.last==='W' && r.n>=5) return 'box-shadow:0 0 0 1px #ff7a2e,0 0 14px rgba(255,122,46,.55);background:rgba(255,122,46,.1)';
  return '';
}
function cellHtml(m){ return m ? `<div class="cell ${m}">${m}</div>` : `<div class="cell A">–</div>`; }

function render(){
  const app = document.getElementById('app');
  const d = S.data;
  let h = `<div class="wrap"><div class="top"><img class="crest" src="${CREST}" alt="Wappen VfL Stenum"><div class="grow"><div class="eyebrow">VfL STENUM II${d? ' · TRAININGSTAG '+Object.keys(d.days).length : ''}</div><h1>Tabelle</h1></div>`;
  h += `<select class="chipbtn" data-act="season" aria-label="Saison">${S.seasons.map(s=>`<option value="${s}" ${s===S.seasonId?'selected':''}>Saison ${esc(s.replace('-','/'))}</option>`).join('') || `<option>Saison ${DEFAULT_SEASON.replace('-','/')}</option>`}</select>`;
  h += `</div><div class="neon"></div>`;

  if (!S.loaded){ h += `<div class="empty">Lade Tabelle …</div>`; }
  else if (S.error){ h += `<div class="empty">Die Daten konnten nicht geladen werden.<br><span class="muted">${esc(S.error)}</span></div>`; }
  else if (!d){
    h += `<div class="empty">Für diese Saison gibt es noch keine Daten.${isTrainer()? `<br><br><button class="btn pri" style="flex:none" data-act="init">Saison ${esc(S.seasonId.replace('-','/'))} anlegen</button>` : '<br>Sobald das erste Abschlussspiel eingetragen ist, erscheint hier die Tabelle.'}</div>`;
  } else {
    const C = compute(d); const R = ranked(C,d);
    const dates = C.dates.slice().reverse();
    const hotR = R.filter(r=>r.last==='W'&&r.n>=3).sort((a,b)=>b.n-a.n)[0];
    const coldR = R.filter(r=>r.last==='L'&&r.n>=3).sort((a,b)=>b.n-a.n)[0];
    const bestR = R.find(r=>r.games>0);
    h += `<div class="cards">
      <div class="card hot"><div class="k">HEISSESTE STREAK</div>${hotR? `<div class="v">${FLAME('#ff7a2e')}${esc(hotR.p.name)}</div><div class="s">${hotR.n} Siege in Folge</div>` : `<div class="v muted">–</div><div class="s">Noch keine Streak ab 3 Siegen</div>`}</div>
      <div class="card cold"><div class="k">KÄLTESTE STREAK</div>${coldR? `<div class="v">${FLAKE}${esc(coldR.p.name)}</div><div class="s">${coldR.n} Niederlagen in Folge</div>` : `<div class="v muted">–</div><div class="s">Noch keine Streak ab 3 Niederlagen</div>`}</div>
      <div class="card best"><div class="k">BESTE QUOTE</div>${bestR? `<div class="v">${esc(bestR.p.name)}<span style="color:var(--cy)">${bestR.quote}%</span></div><div class="s">${bestR.w} Siege · ${bestR.l} Niederlagen</div>` : `<div class="v muted">–</div><div class="s">Noch keine Spiele</div>`}</div>
    </div>`;
    const cols = `34px 112px 38px 38px 62px 84px repeat(${dates.length}, 44px) 64px`;
    const rk = '38px';
    const head = `<div class="row head" style="--cols:${cols};--rk:${rk}"><div class="sticky1">#</div><div class="sticky2" style="padding-left:2px">Spieler</div><div class="num">S</div><div class="num">N</div><div>Quote</div><div>Streak</div>${dates.map(dt=>{const f=fmtD(dt);return isTrainer()?`<button class="dhead edit" data-act="editday" data-date="${dt}" aria-label="Trainingstag ${f.long} bearbeiten">${f.wd}<b>${f.d}</b></button>`:`<div class="dhead">${f.wd}<b>${f.d}</b></div>`}).join('')}<div class="alt" title="Startstand aus dem Notizbuch (Siege | Niederlagen)">Alt</div></div>`;
    const rowHtml = (r, i, hid) => {
      const bar = !hid && i===0 ? 'var(--cy)' : !hid && i<3 ? 'rgba(34,230,255,.4)' : 'transparent';
      const hot = r.last==='W' && r.n>=5;
      return `<div class="row" style="--cols:${cols};--rk:${rk}${hot?';background:rgba(255,122,46,.07)':''}"><div class="sticky1" style="border-left-color:${bar}"><span class="rk">${hid?'–':i+1}</span></div><div class="sticky2"><button class="nm" data-act="profile" data-id="${r.p.id}" style="${nameFx(r)};${hid?'color:#cfd1e6':''}">${esc(r.p.name)}</button></div>
        <div class="num" style="color:var(--w)">${r.w}</div><div class="num" style="color:var(--l)">${r.l}</div>
        <div class="q"><b>${r.quote===null?'–':r.quote+'%'}</b><div class="qb"><i style="width:${r.quote||0}%"></i></div></div>
        <div>${pill(r)}</div>${dates.map(dt=>cellHtml(r.cells[dt])).join('')}<div class="alt">${(r.alt.w||r.alt.l)? (r.alt.w||0)+' | '+(r.alt.l||0) : '–'}</div></div>`;
    };
    if (!R.length) h += `<div class="empty">Keine Spieler im Ranking.</div>`;
    else {
      h += `<div class="scroll"><div class="tbl">${head}<div class="panel" style="min-width:max-content">${R.map((r,i)=>rowHtml(r,i,false)).join('')}</div>`;
      const H = d.players.filter(p=>p.hidden).map(p=>C.res[p.id]);
      if (H.length){
        h += `<div class="sec">NICHT IM RANKING</div><div class="panel dash" style="min-width:max-content">${H.map(r=>rowHtml(r,0,true)).join('')}</div>`;
      }
      h += `</div></div>`;
    }
    const lc = (m,t) => `<span style="display:inline-flex;align-items:center;gap:6px"><span class="cell ${m}" style="width:30px;height:26px;font-size:12px">${m==='A'?'–':m}</span>${t}</span>`;
    h += `<div class="legend">${lc('W','Sieg')}${lc('L','Niederlage')}${lc('A','nicht dabei')}<span class="pill hot1" style="padding:2px 8px">${FLAME('#ffab5c')}3+</span><span class="pill hot2" style="padding:2px 8px">${FLAME('#ff7a2e')}5+</span><span class="pill hot3" style="padding:2px 8px">${FLAME('#4db8ff')}7+</span><span class="pill ice" style="padding:2px 8px">${FLAKE}3+</span><span class="muted" style="flex-basis:100%">Streak = Siege oder Niederlagen in Folge, verpasste Trainings unterbrechen sie nicht. „Alt" = Startstand aus dem Notizbuch (S | N).</span></div>`;
  }
  h += `</div>`;
  // bottom bar
  if (isTrainer()) h += `<div class="bar"><button class="btn" data-act="menu" aria-label="Mehr">⋯</button><button class="btn pri" data-act="newday">Training eintragen</button></div>`;
  else h += `<div class="bar" style="justify-content:flex-end;pointer-events:none"><button class="chipbtn" style="pointer-events:auto;height:40px;font-size:13px;color:var(--mut)" data-act="login">Trainer-Login</button></div>`;
  app.innerHTML = h;
}

/* ---------- sheets ---------- */
let sheetKind = null, sheetState = null;
const layer = document.getElementById('layer');
function openSheet(kind, html, state){ sheetKind = kind; sheetState = state||{}; layer.innerHTML = `<div class="ov" data-act="ovclose"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeSheet(){ layer.innerHTML=''; sheetKind=null; sheetState=null; }
function refreshOpenSheet(){ /* sheets work on their own local copy; don't clobber input */ }
function shHead(eb, title){ return `<div class="sh-h"><div><div class="eyebrow">${eb}</div><h2>${title}</h2></div><button class="x" data-act="close" aria-label="Schließen">${XICO}</button></div>`; }
let toastT;
function toast(msg){ document.querySelectorAll('.toast').forEach(e=>e.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }

function loginSheet(){
  openSheet('login', `${shHead('NUR FÜR TRAINER','Anmelden')}<div class="sh-b">
    <div class="field"><label for="lu">Benutzername</label><input class="inp" id="lu" autocomplete="username" autocapitalize="none" autocorrect="off" placeholder="z. B. daniel"></div>
    <div class="field"><label for="lp">Passwort</label><input class="inp" id="lp" type="password" autocomplete="current-password"></div>
    <div class="err" id="lerr"></div>
    <div class="txt">Die Tabelle können alle mit dem Link ansehen. Eintragen geht nur nach der Anmeldung. Sie bleibt auf diesem Gerät gespeichert.</div></div>
    <div class="sh-f"><button class="btn pri" data-act="dologin">Anmelden</button></div>`);
  setTimeout(()=>document.getElementById('lu')?.focus(),50);
}
async function doLogin(){
  const u = document.getElementById('lu').value.trim().toLowerCase(), p = document.getElementById('lp').value;
  const err = document.getElementById('lerr');
  if (!u || !p){ err.textContent='Bitte Benutzername und Passwort eingeben.'; return; }
  const btn = document.querySelector('[data-act=dologin]'); btn.disabled = true; btn.textContent='…';
  try { await signInWithEmailAndPassword(auth, u.includes('@')?u:u+USER_DOMAIN, p); closeSheet(); toast('Angemeldet'); }
  catch(e){ err.textContent = (e.code||'').includes('network') ? 'Keine Verbindung. Bitte später nochmal versuchen.' : 'Benutzername oder Passwort stimmt nicht.'; btn.disabled=false; btn.textContent='Anmelden'; }
}

function daySheet(date){
  const d = S.data; if (!d) return;
  const existing = d.days[date];
  const marks = Object.assign({}, existing||{});
  openSheet('day', '', {date, marks, existed: !!existing});
  renderDay();
}
function renderDay(){
  const st = sheetState, d = S.data;
  const vis = d.players.filter(p=>!p.hidden), hid = d.players.filter(p=>p.hidden);
  const cnt = m => Object.values(st.marks).filter(x=>x===m).length;
  const w = cnt('W'), l = cnt('L'), a = d.players.length - w - l;
  const row = p => { const m = st.marks[p.id]||''; return `<div class="li"><div><div class="n">${esc(p.name)}</div>${p.role?`<div class="r">${esc(p.role)}</div>`:''}</div><button class="tap ${m}" data-act="tap" data-id="${p.id}" aria-label="${esc(p.name)}: ${m||'nicht dabei'}">${m||'+'}</button></div>`; };
  const html = `${shHead(st.existed?'TRAININGSTAG BEARBEITEN':'ABSCHLUSSSPIEL','Training eintragen')}<div class="sh-b">
    <div class="field"><label for="dd">Datum</label><input class="inp" id="dd" type="date" value="${st.date}"></div>
    ${d.days[st.date] && !st.existed ? '' : ''}
    <div class="chips" id="cnts"><span class="chip w">${w} W</span><span class="chip l">${l} L</span><span class="chip">${a} nicht dabei</span>${w!==l && w+l>0 ? `<span class="chip warn">Teams ungleich groß</span>`:''}</div>
    <div class="txt">Antippen: leer → W → L → leer. Leer heißt nicht dabei. Speichern geht immer, auch unvollständig.</div>
    <div class="list">${vis.map(row).join('')}</div>
    ${hid.length? `<div class="sec">NICHT IM RANKING</div><div class="list">${hid.map(row).join('')}</div>`:''}
  </div><div class="sh-f"><button class="btn" data-act="close">Abbrechen</button>${st.existed?`<button class="btn danger" data-act="delday">Löschen</button>`:''}<button class="btn pri" data-act="saveday">Speichern</button></div>`;
  const sh = layer.querySelector('.sheet'); const sc = sh.querySelector('.sh-b'); const top = sc? sc.scrollTop : 0;
  sh.innerHTML = html; const sc2 = sh.querySelector('.sh-b'); if (sc2) sc2.scrollTop = top;
}
async function saveDay(){
  const st = sheetState; const date = document.getElementById('dd').value || st.date;
  const marks = {}; for (const [k,v] of Object.entries(st.marks)) if (v==='W'||v==='L') marks[k]=v;
  const btn = document.querySelector('[data-act=saveday]'); btn.disabled = true; btn.textContent='Speichert …';
  try {
    const was = S.data.days[date];
    if (!Object.keys(marks).length){
      if (was) await updateDoc(ref(), new FieldPath('days',date), deleteField());
      else { toast('Nichts eingetragen'); btn.disabled=false; btn.textContent='Speichern'; return; }
    } else {
      if (was && date!==st.date && st.existed){ /* date moved onto another existing day: overwritten */ }
      await updateDoc(ref(), new FieldPath('days',date), marks);
      if (st.existed && date!==st.date) await updateDoc(ref(), new FieldPath('days',st.date), deleteField());
    }
    closeSheet(); toast('Gespeichert');
  } catch(e){ btn.disabled=false; btn.textContent='Speichern'; toast('Speichern fehlgeschlagen: bitte neu anmelden und nochmal versuchen'); console.error(e); }
}
async function delDay(){
  if (!confirm('Diesen Trainingstag wirklich löschen?')) return;
  try { await updateDoc(ref(), new FieldPath('days',sheetState.date), deleteField()); closeSheet(); toast('Gelöscht'); } catch(e){ toast('Löschen fehlgeschlagen'); }
}

function playersSheet(){

  renderPlayers();
}

  <div class="field" style="margin-top:16px"><label for="np">Neuer Spieler</label><input class="inp" id="np" placeholder="Name" autocomplete="off"></div></div>

async function savePlayers(players){ try { await updateDoc(ref(), {players}); S.data.players = players; renderPlayers(); } catch(e){ toast('Speichern fehlgeschlagen'); } }

function startSheet(){
  const d = S.data; const alt = d.alt||{};
  const st = {vals:{}, useStreak: Object.values(alt).some(a=>a.sn>0)};
  for (const p of d.players){ const a = alt[p.id]||{}; st.vals[p.id] = {w:a.w??'', l:a.l??'', sn:a.sn??'', st:a.st||''}; }
  openSheet('start','',st); renderStart();
}
function startTotals(){
  const st = sheetState; let done=0,sw=0,sl=0;
  for (const v of Object.values(st.vals)){ if (v.w!==''||v.l!==''){done++;} sw += +v.w||0; sl += +v.l||0; }
  return {done,sw,sl,total:Object.keys(st.vals).length};
}
function renderStart(){
  const st = sheetState, d = S.data, t = startTotals();
  const sh = layer.querySelector('.sheet'); const top = sh.querySelector('.sh-b')?.scrollTop||0;
  const f = v => v!=='' ? ' f':'';
  sh.innerHTML = `${shHead('EINMALIG · SAISON '+esc(S.seasonId.replace('-','/')),'Startstand eintragen')}<div class="sh-b">
  <div class="txt">Trag pro Spieler ein, wie oft er laut Notizbuch bisher gewonnen und verloren hat. Das zählt als Startstand.</div>
  <div class="chips"><span class="chip c" id="tdone">${t.done} von ${t.total} ausgefüllt</span><span class="chip" id="tsum">Summe ${t.sw} S · ${t.sl} N</span></div>
  <div class="list"><div class="li" style="min-height:56px"><div><div class="n" style="font-size:14px">Aktuelle Streak auch eintragen</div><div class="r">Optional, nur wo Daniel sie kennt</div></div><button class="sw ${st.useStreak?'on':''}" role="switch" aria-checked="${st.useStreak}" data-act="streaksw" style="width:68px"><span><i></i></span></button></div></div>
  <div class="shead ${st.useStreak?'':'noS'}"><div>Spieler</div><div style="color:var(--w)">Siege</div><div style="color:var(--l)">Niederl.</div>${st.useStreak?`<div style="color:var(--fl);width:96px">Streak</div>`:''}</div>
  <div class="list" style="margin-top:0">${d.players.map(p=>{const v=st.vals[p.id];return `<div class="srow ${st.useStreak?'':'noS'}"><div class="n" style="font-size:16px;font-weight:700">${esc(p.name)}</div>
    <input class="ni w${f(v.w)}" type="number" inputmode="numeric" min="0" data-f="w" data-id="${p.id}" value="${v.w}" placeholder="0" aria-label="${esc(p.name)} Siege">
    <input class="ni l${f(v.l)}" type="number" inputmode="numeric" min="0" data-f="l" data-id="${p.id}" value="${v.l}" placeholder="0" aria-label="${esc(p.name)} Niederlagen">
    ${st.useStreak?`<div class="sg"><input class="ni s${f(v.sn)}" type="number" inputmode="numeric" min="0" data-f="sn" data-id="${p.id}" value="${v.sn}" placeholder="–" aria-label="${esc(p.name)} Streak Anzahl"><button class="tg ${v.st}" data-act="togst" data-id="${p.id}" aria-label="${esc(p.name)} Streak W oder L">${v.st||'–'}</button></div>`:''}</div>`}).join('')}</div>
  <div class="txt" style="text-align:center;margin-top:12px">${st.useStreak?'Streak leer lassen heißt: sie startet bei null. ':''}Zur Kontrolle sollten Siege und Niederlagen aller Spieler ungefähr gleich viele sein.</div></div>
  <div class="sh-f"><button class="btn" data-act="close">Später</button><button class="btn pri" data-act="savestart">Startstand speichern</button></div>`;
  sh.querySelector('.sh-b').scrollTop = top;
}
async function saveStart(){
  const st = sheetState; const alt = {};
  for (const [id,v] of Object.entries(st.vals)){
    if (v.w===''&&v.l==='') { if(!(st.useStreak && +v.sn>0 && v.st)) continue; }
    const o = {w: +v.w||0, l: +v.l||0};
    if (st.useStreak && +v.sn>0 && (v.st==='W'||v.st==='L')){ o.sn = +v.sn; o.st = v.st; }
    alt[id] = o;
  }
  try { await updateDoc(ref(), {alt}); closeSheet(); toast('Startstand gespeichert'); } catch(e){ toast('Speichern fehlgeschlagen'); }
}

function profileSheet(id){
  const d = S.data; const C = compute(d); const r = C.res[id]; if (!r) return;
  const R = ranked(C,d); const idx = R.findIndex(x=>x.p.id===id);
  const q = r.quote||0; const dash = Math.round(277*q/100);
  const last8 = C.dates.slice(-8);
  const pts = r.pts; let chart='';
  if (pts.length>=2){ const W=320,H=76; const xs = pts.map((v,i)=>(i/(pts.length-1))*W); const lo=Math.max(0,Math.min(...pts)-5), hi=Math.min(100,Math.max(...pts)+5); const ys = pts.map(v=>H-((v-lo)/(hi-lo||1))*H); chart = `<div class="sec">VERLAUF DER QUOTE</div><div class="panel" style="height:96px;padding:10px 12px"><svg width="100%" height="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Quote über die Saison"><polyline points="${xs.map((x,i)=>x.toFixed(1)+','+ys[i].toFixed(1)).join(' ')}" fill="none" stroke="#22e6ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 5px rgba(34,230,255,.7))"/></svg></div>`; }
  const badges = `${idx>=0?`<span class="chip c">Platz ${idx+1}</span>`:`<span class="chip" style="border-style:dashed">Nicht im Ranking</span>`}${r.last==='W'&&r.n>=3?`<span class="pill ${r.n>=7?'hot3':r.n>=5?'hot2':'hot1'}">${FLAME(r.n>=7?'#4db8ff':r.n>=5?'#ff7a2e':'#ffab5c')}${r.n} Streak</span>`:''}${r.last==='L'&&r.n>=3?`<span class="pill ice">${FLAKE}${r.n} Streak</span>`:''}`;
  openSheet('profile', `${shHead('VfL STENUM II · SAISON '+esc(S.seasonId.replace('-','/')), esc(r.p.name))}<div class="sh-b">
   <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div class="chips" style="flex:1">${badges}</div>
   <div style="position:relative;width:104px;height:104px;flex:none"><svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true"><circle cx="52" cy="52" r="44" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="8"/><circle cx="52" cy="52" r="44" fill="none" stroke="#22e6ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="${dash} 277" transform="rotate(-90 52 52)" style="filter:drop-shadow(0 0 6px rgba(34,230,255,.7))"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:${r.quote===null?20:24}px;font-weight:800;line-height:1">${r.quote===null?'–':q+'%'}</div><div style="font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--mut);margin-top:3px">QUOTE</div></div></div></div>
   <div class="grid3"><div class="sc" style="border-color:rgba(46,242,192,.35)"><div class="k">SIEGE</div><div class="v" style="color:var(--w)">${r.w}</div></div><div class="sc" style="border-color:rgba(255,79,139,.35)"><div class="k">NIEDERL.</div><div class="v" style="color:var(--l)">${r.l}</div></div><div class="sc"><div class="k">SPIELE</div><div class="v">${r.games}</div></div></div>
   <div class="grid2"><div class="sc" style="border-color:rgba(255,171,92,.35)"><div class="k">BESTE STREAK</div><div class="v" style="font-size:20px;color:var(--fl)">${r.bw>0?FLAME('#ffab5c').replace('width="16" height="16"','width="18" height="18" style="display:inline;vertical-align:-3px"')+' '+r.bw+' Siege':'–'}</div></div><div class="sc" style="border-color:rgba(143,232,255,.35)"><div class="k">MIESESTE STREAK</div><div class="v" style="font-size:20px;color:var(--ice)">${r.bl>0?r.bl+' Niederl.':'–'}</div></div></div>
   <div class="sec">LETZTE TRAININGS <span class="muted" style="font-weight:500;letter-spacing:0;float:right">Dabei: ${r.att} von ${C.dates.length}</span></div>
   ${last8.length? `<div class="form">${last8.map(dt=>`<div>${cellHtml(r.cells[dt])}<span>${fmtD(dt).d}</span></div>`).join('')}</div>` : `<div class="txt">Noch keine Abschlussspiele eingetragen.</div>`}
   ${chart}${(r.alt.w||r.alt.l)?`<div class="txt" style="margin-top:14px">Startstand aus dem Notizbuch: ${r.alt.w||0} Siege, ${r.alt.l||0} Niederlagen.</div>`:''}
  </div><div class="sh-f"></div>`);
}

function newSeasonSheet(){
  const y = new Date().getFullYear(); const sug = (new Date().getMonth()>=6? y+'-'+String((y+1)%100).padStart(2,'0') : (y-1)+'-'+String(y%100).padStart(2,'0'));
  openSheet('newseason', `${shHead('TRAINER','Neue Saison')}<div class="sh-b"><div class="txt">Legt eine neue, leere Saison an. Die Spielerliste wird übernommen, Siege und Niederlagen starten bei null. Alte Saisons bleiben erhalten.</div><div class="field"><label for="ns">Saison</label><input class="inp" id="ns" value="${next(sug)}" placeholder="2027-28"></div><div class="err" id="nserr"></div></div><div class="sh-f"><button class="btn" data-act="close">Abbrechen</button><button class="btn pri" data-act="donewseason">Anlegen</button></div>`);
  function next(s){ const [a,b]=s.split('-').map(Number); return (a+1)+'-'+String((b+1)%100).padStart(2,'0'); }
}
async function doNewSeason(){
  const v = document.getElementById('ns').value.trim(); const err = document.getElementById('nserr');
  if (!/^\d{4}-\d{2}$/.test(v)){ err.textContent='Bitte so eingeben: 2027-28'; return; }
  if (S.seasons.includes(v)){ err.textContent='Diese Saison gibt es schon.'; return; }
  try { await setDoc(doc(db,'seasons',v), {players: S.data? S.data.players : DEFAULT_PLAYERS, days:{}, alt:{}}); S.seasonId=v; try{localStorage.setItem('season',v);}catch(e){} closeSheet(); await loadSeasons(); subscribe(); toast('Saison '+v.replace('-','/')+' angelegt'); } catch(e){ err.textContent='Anlegen fehlgeschlagen.'; }
}
function exportData(){
  const blob = new Blob([JSON.stringify({season:S.seasonId, exported:new Date().toISOString(), data:S.data},null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'stenum-tabelle-'+S.seasonId+'-'+todayISO()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act==='ovclose'){ if (e.target===t) closeSheet(); return; }
  switch(act){
    case 'close': closeSheet(); break;
    case 'login': loginSheet(); break;
    case 'dologin': doLogin(); break;
    case 'logout': await signOut(auth); closeSheet(); toast('Abgemeldet'); break;
    case 'menu': menuSheet(); break;
    case 'newday': daySheet(todayISO()); break;
    case 'editday': daySheet(t.dataset.date); break;
    case 'tap': { const id=t.dataset.id; const cur=sheetState.marks[id]||''; const nx = cur===''?'W':cur==='W'?'L':''; if (nx) sheetState.marks[id]=nx; else delete sheetState.marks[id]; renderDay(); break; }
    case 'saveday': saveDay(); break;
    case 'delday': delDay(); break;
    case 'players': playersSheet(); break;
    case 'toggleplayer': { const ps = S.data.players.map(p=>p.id===t.dataset.id?{...p,hidden:!p.hidden}:p); savePlayers(ps); break; }
    case 'addplayer': { const n = document.getElementById('np').value.trim(); if(!n) break; let id = slug(n), k=2; while (S.data.players.some(p=>p.id===id)) id = slug(n)+'-'+k++; savePlayers([...S.data.players,{id,name:n,role:'',hidden:false}]); break; }
    case 'start': startSheet(); break;
    case 'streaksw': sheetState.useStreak = !sheetState.useStreak; renderStart(); break;
    case 'togst': { const v = sheetState.vals[t.dataset.id]; v.st = v.st===''?'W':v.st==='W'?'L':''; renderStart(); break; }
    case 'savestart': saveStart(); break;
    case 'newseason': newSeasonSheet(); break;
    case 'donewseason': doNewSeason(); break;
    case 'export': exportData(); break;
    case 'profile': profileSheet(t.dataset.id); break;
    case 'init': try { await setDoc(ref(), {players:DEFAULT_PLAYERS, days:{}, alt:{}}); loadSeasons(); } catch(e){ toast('Anlegen fehlgeschlagen'); } break;
  }
});
document.addEventListener('input', e => {
  const t = e.target; if (t.dataset && t.dataset.f && sheetKind==='start'){
    const v = sheetState.vals[t.dataset.id]; v[t.dataset.f] = t.value;
    t.classList.toggle('f', t.value!=='');
    const tt = startTotals(); document.getElementById('tdone').textContent = tt.done+' von '+tt.total+' ausgefüllt'; document.getElementById('tsum').textContent = 'Summe '+tt.sw+' S · '+tt.sl+' N';
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act==='season'){ S.seasonId = t.value; try{localStorage.setItem('season',S.seasonId);}catch(e){} subscribe(); }
  if (t.id==='dd' && sheetKind==='day'){ const date=t.value; if(!date) return; const ex = S.data.days[date]; sheetState.date = date; sheetState.existed = !!ex; sheetState.marks = Object.assign({}, ex||{}); renderDay(); }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && sheetKind==='login') doLogin(); if (e.key==='Escape') closeSheet(); });

onAuthStateChanged(auth, u => { S.user = u; render(); });
loadSeasons(); subscribe();
</script>
</body>
</html>
